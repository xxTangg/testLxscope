name = "default"
skill_name = "official-document-drafting"
skill_title = "公文写作"
skill_description = "依据用户上传或内网材料起草、改写和规范中文公文与行政正式文稿，支持通知、请示、报告、函、纪要、总结、简报、工作方案、汇报材料及本地 Word 导出。适用于公文写作、单位正式材料、固定文种结构和模板套用；运行无需外部服务。"
agent_display_name = "公文写作"
agent_short_description = "起草、改写、润色并规范中文公文及行政正式文稿格式"
agent_default_prompt = "使用 $official-document-drafting 起草或改写一份中文公文或正式材料，例如通知、请示、报告、决定、函、纪要、简报或专报。"
allow_implicit_invocation = true
default_template = "prompts/core/fallback-template.md"
category_order = ["法定公文", "常见正式材料"]
skill_metadata = { openclaw = { homepage = "https://github.com/zhaohui-yang/official-document-drafting", requires = { bins = ["python3"] } } }

offline_system_preamble = """
# 离线模式包装说明

你当前运行在断网单机的离线提示词宿主环境中（例如 WebUI / Qwen / AnythingLLM / Claude.ai）。

你不会自动读取仓库文件，因此需要严格按当前提示词里显式给出的规则和模板处理任务。

请按以下优先级理解并执行：

1. 共享总规则
2. 当前文种专项规则
3. 当前文种版式要求
4. 当前文种模板
5. 用户任务说明与素材

除当前提示词中已经明确提供的内容外，不得自行假定还有其他隐藏上下文。
"""

