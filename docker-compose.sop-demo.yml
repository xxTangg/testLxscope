services:
  sop-demo-model:
    image: testlxscope-intranet:latest
    restart: unless-stopped
    entrypoint: ["python", "/demo/model_server.py"]
    volumes:
      - ./examples/sop_dag_demo:/demo:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
