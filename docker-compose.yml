services:
  egress:
    image: testlxscope-egress:latest
    build:
      context: ./deploy
      dockerfile: Dockerfile.egress
    container_name: ${COMPOSE_PROJECT_NAME:-ori_asv1}-egress
    restart: unless-stopped
    # Squid sizes its startup file descriptor table from this limit.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          from socket import create_connection;
          create_connection(('127.0.0.1', 3128), timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 10

  user-sandbox:
    image: testlxscope-sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      additional_contexts:
        api-image: service:agentscope
    profiles: [build]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        else
        exec redis-server --appendonly yes;
        fi
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping;
          else
          redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 20

  agentscope:
    image: testlxscope-intranet:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      egress:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      USER_SANDBOX_IMAGE: testlxscope-sandbox:latest
      USER_SANDBOX_PREFIX: ${COMPOSE_PROJECT_NAME:-ori_asv1}
      USER_SANDBOX_EGRESS: ${COMPOSE_PROJECT_NAME:-ori_asv1}-egress
      # Use the backend network for model calls, including private gateways.
      NO_PROXY: "*"
      no_proxy: "*"
      REDIS_HOST: redis
      TZ: Asia/Shanghai
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AGENTSCOPE_PORT: 8000
      UVICORN_RELOAD: "false"
      AGENTSCOPE_USERNAME: ${AGENTSCOPE_USERNAME:-admin}
      AGENTSCOPE_USER_ID: ${AGENTSCOPE_USER_ID:-local-user}
      AGENTSCOPE_PASSWORD: ${AGENTSCOPE_PASSWORD:-change-me}
      AGENTSCOPE_AUTH_USERS: ${AGENTSCOPE_AUTH_USERS:-}
      AGENTSCOPE_JWT_SECRET: ${AGENTSCOPE_JWT_SECRET:-change-me-in-production-use-32-bytes}
      AGENTSCOPE_JWT_EXPIRE_MINUTES: ${AGENTSCOPE_JWT_EXPIRE_MINUTES:-1440}
      QDRANT_PATH: ${QDRANT_PATH:-/app/qdrant_data}
      AGENTSCOPE_DOWNLOAD_SECRET: ${AGENTSCOPE_DOWNLOAD_SECRET:-change-me-in-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentscope-blobs:/app/blobs
      - qdrant-data:/app/qdrant_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/auth/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web-ui:
    image: testlxscope-web-ui:latest
    build:
      context: ./examples/web_ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      agentscope:
        condition: service_healthy
    ports:
      - "${WEB_UI_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
  agentscope-blobs:
  qdrant-data:
